[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nearbeam"
version = "1.4.0"
description = "Ultra-Fast Local Wi-Fi File Sharing & Explorer with Multi-Device Mesh"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Tanumay Goswami", email = "tanumaygoswami2001@gmail.com" }
]
dependencies = [
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "qrcode>=8.0.0",
    "Pillow>=10.0.0",
    "PySide6>=6.5.0",
    "zeroconf>=0.130.0",
]

[project.urls]
Homepage = "https://github.com/tanumay-deb/NearBeam"
Repository = "https://github.com/tanumay-deb/NearBeam"
Releases = "https://github.com/tanumay-deb/NearBeam/releases"

[project.scripts]
nearbeam = "main:main"
nearbeam-gui = "main:main"
landrop = "main:main"
