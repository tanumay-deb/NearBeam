<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NearBeam - Auto Finder</title>
  <link rel="icon" type="image/png" href="/static/favicon.png" />
  <style>
    body {
      background-color: #0b0f19;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: #1e293b;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 32px 24px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 { margin: 0 0 8px; font-size: 1.3rem; }
    p { color: #94a3b8; font-size: 0.9rem; line-height: 1.4; margin: 0 0 20px; }
    .status { font-size: 0.85rem; color: #38bdf8; font-weight: bold; }
    .btn {
      background: #0284c7;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner" id="spinner"></div>
    <h2 id="title">Finding Your PC...</h2>
    <p id="desc">Scanning local Wi-Fi to find your computer's updated IP address.</p>
    <div class="status" id="status">Probing network...</div>
    <button class="btn" id="retryBtn" style="display:none;" onclick="startScan()">Scan Again</button>
  </div>

  <script>
    const PORT = 5000;
    const commonSubnets = [
      "192.168.1",
      "192.168.0",
      "192.168.29",
      "192.168.31",
      "10.0.0"
    ];

    async function checkHost(ip) {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 900);
      try {
        const res = await fetch(`http://${ip}:${PORT}/api/info`, {
          signal: controller.signal,
          mode: 'cors'
        });
        clearTimeout(timeoutId);
        if (res.ok) {
          const data = await res.json();
          if (data && data.hostname) {
            return { ip, data };
          }
        }
      } catch (e) {
        // unreachable
      }
      return null;
    }

    async function startScan() {
      document.getElementById("spinner").style.display = "block";
      document.getElementById("retryBtn").style.display = "none";
      document.getElementById("title").innerText = "Finding Your PC...";
      document.getElementById("desc").innerText = "Scanning local Wi-Fi to find your computer's updated IP address.";

      // First check permanent mDNS
      document.getElementById("status").innerText = "Checking nearbeam.local...";
      try {
        const mres = await checkHost("nearbeam.local");
        if (mres) {
          onFound("nearbeam.local", mres.data);
          return;
        }
      } catch (e) {}

      // Get last known IP from localStorage if available
      const lastIp = localStorage.getItem("nearbeam_last_ip") || localStorage.getItem("landrop_last_ip");
      if (lastIp) {
        document.getElementById("status").innerText = `Checking last known IP (${lastIp})...`;
        const res = await checkHost(lastIp);
        if (res) {
          onFound(lastIp, res.data);
          return;
        }
      }

      // Parallel batch sweep over common subnets
      for (const subnet of commonSubnets) {
        document.getElementById("status").innerText = `Scanning ${subnet}.x on Wi-Fi...`;
        const batchSize = 35;
        for (let i = 1; i <= 254; i += batchSize) {
          const promises = [];
          for (let j = i; j < i + batchSize && j <= 254; j++) {
            promises.push(checkHost(`${subnet}.${j}`));
          }
          const results = await Promise.all(promises);
          const found = results.find(r => r !== null);
          if (found) {
            onFound(found.ip, found.data);
            return;
          }
        }
      }

      // If not found
      document.getElementById("spinner").style.display = "none";
      document.getElementById("title").innerText = "PC Not Found";
      document.getElementById("desc").innerText = "Make sure NearBeam is running on your computer and both devices are on the same Wi-Fi.";
      document.getElementById("status").innerText = "";
      document.getElementById("retryBtn").style.display = "inline-block";
    }

    function onFound(ip, data) {
      localStorage.setItem("nearbeam_last_ip", ip);
      document.getElementById("spinner").style.display = "none";
      document.getElementById("title").innerText = "PC Found!";
      document.getElementById("desc").innerText = `Connecting to ${data.hostname} at ${ip}...`;
      document.getElementById("status").innerText = "Redirecting in a moment...";
      setTimeout(() => {
        window.location.href = `http://${ip}:${PORT}`;
      }, 700);
    }

    window.onload = startScan;
  </script>
</body>
</html>
